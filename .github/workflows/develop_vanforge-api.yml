name: Deploy backend to Azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare Azure requirements
        run: cp backend/requirements.txt requirements.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.venv/
            !frontend/node_modules/
            !frontend/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6DB0D7E2D5BB46BF8A15AF8F273F15E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53658196D7A54265884DFFC7104BF8CC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_65828A8D2331417EB8FBEB9E88419FCD }}

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: vanforge-api
          slot-name: Production
          package: .